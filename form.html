<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Contact Us</title>
  </head>
  <body>
    <div id="container">
      <form>
        <fieldset>
          <legend>Contact us</legend>

          <label for="name">Name: </label>
          <input type="text" placeholder="Your name here" id="name" /> <br />

          Email: <input type="emai" placeholder="name@email.com" /> <br />
          <br /><br />
          Preference:<br />
          <input type="radio" name="Preference" />PC <br />
          <input type="radio" name="Preference" />Console <br />

          <br /><br />

          Main use:<br />
          <input type="checkbox" />productive tasks<br />
          <input type="checkbox" />Gaming.<br />

          <br /><br />

          <label for="selection">Time:</label><br />
          <select id="selection">
            <option>3 hours</option>
            <option>6 hours</option>
            <option>9 hours</option>
          </select>

          <br /><br />

          Description: <textarea cols="30" rows="3"></textarea> <br />
          <br />

          <input type="submit" value="Contact us" />

          <input type="reset" value="reser form" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
